<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永續未來 | 互動體驗</title>
    <style>
        /* 定義全域 CSS 變數，方便切換主題 */
        :root {
            --primary: #2E8B57; /* 海洋綠 */
            --bg-color: #F5F5F0;
            --text-color: #333;
            --card-bg: #FFFFFF;
        }
        
        /* 透過屬性選取器設定深色模式變數 */
        [data-theme="dark"] {
            --primary: #4CAF50;
            --bg-color: #1A1A1A;
            --text-color: #E0E0E0;
            --card-bg: #2D2D2D;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, rgba(46,139,87,0.1), rgba(46,139,87,0.3));
        }
        
        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--primary);
            letter-spacing: 2px;
        }
        
        .container {
            max-width: 800px;
            margin: -2rem auto 2rem; /* 利用負邊距讓內容稍微覆蓋 header */
            padding: 0 1.5rem;
            position: relative;
        }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            margin-bottom: 2rem;
            transition: transform 0.2s, background-color 0.4s ease;
        }
        
        .card:hover {
            transform: translateY(-3px);
        }
        
        /* 互動按鈕樣式 */
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .theme-toggle:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        /* 互動式 Checkbox 清單 */
        .checklist {
            list-style: none;
            padding: 0;
        }
        
        .checklist li {
            margin: 1.2rem 0;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }
        
        input[type="checkbox"] {
            margin-right: 15px;
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        
        /* 動態進度條 */
        .progress-container {
            width: 100%;
            background-color: #E0E0E0;
            border-radius: 10px;
            margin-top: 2rem;
            height: 20px;
            overflow: hidden;
        }
        
        [data-theme="dark"] .progress-container {
            background-color: #444;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* 平滑動畫效果 */
        }
        
        .score-display {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0.5rem;
            color: var(--primary);
        }
        
        /* 永續建築概念 Grid */
        .arch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .arch-item {
            padding: 1rem;
            border: 2px solid var(--primary);
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .arch-item:hover {
            background-color: rgba(46,139,87,0.1);
        }
        
        .arch-item.active {
            background-color: var(--primary);
            color: white;
        }
        
        .arch-info {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: rgba(46,139,87,0.08);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            display: none; /* 初始隱藏，點擊後透過 JS 顯示 */
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">切換日/夜間模式</button>

    <header>
        <h1>永續環境與綠色生活</h1>
        <p>探索如何在日常與空間設計中實踐永續理念</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>🌱 你的綠色生活指數</h2>
            <p>勾選你今天完成的永續小習慣，看看你的影響力：</p>
            <ul class="checklist" id="habit-list">
                <li><input type="checkbox" onchange="updateScore()"> 攜帶環保杯與環保餐具</li>
                <li><input type="checkbox" onchange="updateScore()"> 選擇搭乘大眾運輸或騎自行車</li>
                <li><input type="checkbox" onchange="updateScore()"> 確實做好垃圾分類與資源回收</li>
                <li><input type="checkbox" onchange="updateScore()"> 離開房間時隨手關閉電源與冷氣</li>
                <li><input type="checkbox" onchange="updateScore()"> 減少列印紙張，多使用數位筆記與檔案</li>
            </ul>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="score-display" id="score-text">完成度：0%</div>
        </div>

        <div class="card">
            <h2>🏛️ 永續空間設計</h2>
            <p>點擊下方元素，了解如何透過設計降低建築對環境的負擔：</p>
            <div class="arch-grid">
                <div class="arch-item" onclick="showInfo('passive', this)">被動式設計</div>
                <div class="arch-item" onclick="showInfo('materials', this)">循環建材</div>
                <div class="arch-item" onclick="showInfo('greenery', this)">立體綠化</div>
            </div>
            <div id="arch-info" class="arch-info">
                </div>
        </div>
    </div>

    <script>
        // 1. 日/夜間模式切換邏輯
        function toggleTheme() {
            const body = document.body;
            // 透過操作 body 的 data-theme 屬性，觸發 CSS 變數的改變
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        // 2. 進度條計算邏輯
        function updateScore() {
            // 選取所有清單中的 checkbox
            const checkboxes = document.querySelectorAll('#habit-list input[type="checkbox"]');
            let checkedCount = 0;
            
            // 計算被勾選的數量
            checkboxes.forEach(box => {
                if (box.checked) {
                    checkedCount++;
                }
            });

            // 計算百分比並更新 DOM 元素
            const percentage = Math.round((checkedCount / checkboxes.length) * 100);
            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('score-text').innerText = `完成度：${percentage}%`;
        }

        // 3. 資訊卡片動態載入邏輯
        // 建立一個資料物件來儲存不同概念的內容
        const infoData = {
            passive: "<strong>被動式設計 (Passive Design)：</strong><br>利用建築物本身的座向、開窗位置與遮陽設計，最大化自然採光與通風，藉此減少空調與人造照明的耗能。這是在圖面設計階段就能帶來巨大影響的策略，讓建築學會「呼吸」。",
            materials: "<strong>循環建材 (Circular Materials)：</strong><br>優先使用可回收、低碳足跡的當地材料（如綠建材標章產品），並考量建築物生命週期結束後的拆解與材料重組潛力，減少營建廢棄物。",
            greenery: "<strong>立體綠化 (Vertical/Roof Greenery)：</strong><br>透過屋頂薄層綠化或植生牆，不僅能降低都市熱島效應、改善微氣候，還能為建築物提供額外的隔熱層，有效降低室內溫度。"
        };

        function showInfo(type, element) {
            // 移除所有按鈕的 active 狀態
            document.querySelectorAll('.arch-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 為當前點擊的按鈕加上 active 狀態
            element.classList.add('active');

            // 顯示資訊區塊並動態寫入對應內容
            const infoBox = document.getElementById('arch-info');
            infoBox.style.display = 'block';
            
            // 添加簡單的淡入動畫效果
            infoBox.style.opacity = 0;
            infoBox.innerHTML = infoData[type];
            setTimeout(() => {
                infoBox.style.transition = "opacity 0.5s";
                infoBox.style.opacity = 1;
            }, 50);
        }
    </script>
</body>
</html>
